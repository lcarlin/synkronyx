# Limites do inotify.
#
# Cada diretório observado consome um watch, e o Synkronyx observa as duas
# árvores inteiras. O padrão da maioria das distribuições (8192) é baixo para
# árvores grandes: ao estourar, o AddWatch falha com ENOSPC e a árvore fica
# parcialmente observada.
#
# Instalar em /etc/sysctl.d/99-synkronyx-inotify.conf e aplicar com
#   sysctl --system
#
# Regra de bolso: max_user_watches >= (número de diretórios em A + em B) * 1.5

fs.inotify.max_user_watches = 524288
fs.inotify.max_queued_events = 65536
