# Synkronyx — configuração de exemplo
#
# Instalar em /etc/synkronyx/synkronyx.yaml

# As duas raízes da árvore lógica. Obrigatórias, absolutas, e não podem estar
# aninhadas uma na outra (aninhamento produz recursão infinita de eventos).
a: /dados/A
b: /dados/B

# Banco de estado. Precisa ser gravável pelo usuário do serviço.
state_path: /var/lib/synkronyx/state.db

# Janela de silêncio por path antes de propagar. Aumentar em cima de
# workloads que escrevem em rajada (builds, extração de arquivos); diminuir
# se a latência de propagação importar mais que o número de transferências.
debounce: 1s

# Por quanto tempo uma escrita do próprio sincronizador continua sendo
# reconhecida como tal. Aumentar se houver arquivos muito grandes: a escrita
# precisa caber na janela. Não é o único mecanismo anti-loop (ver
# internal/guard), então errar para mais é barato.
#
# O custo de valores altos é localizado: depois de resolver um conflito, o
# engine mantém a expectativa até o TTL vencer, e nesse intervalo alterações
# externas naquele path específico são ignoradas.
self_write_ttl: 60s

# Padrões ignorados nos dois lados. Sem "/" casam contra qualquer componente
# do path; com "/" casam contra o path relativo inteiro.
exclude:
  - .synkronyx
  - ".synkronyx-tmp-*"
  - "*.sync-conflict-*"
  - "*.swp"
  - "~$*"
  - .git/objects

# preserve    — renomeia a versão do destino e mantém as duas (padrão, fail safe)
# newer-wins  — o mtime mais recente vence
# manual      — não toca em nada; marca o par como em conflito
conflict_policy: preserve

# Como resolver divergências pré-existentes no primeiro scan.
# union   — o que existe só de um lado é copiado para o outro
# a-wins  — A é autoritativo
# b-wins  — B é autoritativo
first_sync_policy: union

rsync_path: rsync
rsync_args:
  - --archive
  - --partial
  - --inplace
  - --numeric-ids

# debug | info | warn | error
#
# Em debug o daemon registra também cada eco descartado pelo guard, cada
# evento já refletido no estado e cada varredura do guard. É o que se quer
# para entender o comportamento do sistema, e é volumoso: medido em 50
# arquivos propagados, debug rende ~485 bytes de log por arquivo contra ~135
# em info, ou seja 3,6x. Em árvores com muita escrita, vale conferir o espaço
# do journal antes de deixar assim em produção.
log_level: debug

# Acima deste tamanho o digest passa a ser amostrado em vez de completo:
# tamanho + os primeiros e os últimos hash_sample_bytes.
#
# Isso detecta append, truncamento, reescrita de cabeçalho e alteração de
# cauda por custo fixo — mas NÃO enxerga uma alteração no meio de um arquivo
# grande que preserve o tamanho exato.
#
# O ponto cego é mais estreito do que parece. No fluxo normal de eventos, uma
# escrita sempre altera o mtime, e o mtime é comparado antes do digest: a
# alteração é propagada de qualquer forma. O digest amostrado só decide
# sozinho na reconciliação (first sync e full resync), quando os dois lados
# têm o mesmo tamanho e o mesmo mtime — o caso de uma divergência ocorrida com
# o serviço parado.
#
# 0 desliga a amostragem: digest completo sempre, sem pontos cegos, ao custo
# de ler o arquivo inteiro a cada evento.
hash_max_bytes: 104857600   # 100 MiB
hash_sample_bytes: 4194304  # 4 MiB de cada extremidade, 8 MiB por digest

# --hard-links só funciona dentro de uma mesma invocação do rsync, então a
# preservação vale para cópias de árvore (first sync, full resync, diretório
# novo) e não para arquivos propagados um a um por evento. Ligações criadas
# incrementalmente só voltam a existir no próximo full resync.
preserve_hardlinks: false

# O que fazer ao propagar a remoção de um diretório que, no destino, contém
# conteúdo que nunca foi sincronizado (criado lá e não propagado, ou alterado
# lá depois da última sincronização).
#
# preserve-unknown — move esse conteúdo para <dir>.sync-conflict-<lado>-<data>
#                    antes de remover (padrão, fail safe)
# force            — remove o diretório inteiro sem inspecionar
dir_delete_policy: preserve-unknown

# Reenvio de operações que falharam, com backoff exponencial. Esgotadas as
# tentativas, o path é marcado com erro e um full resync é solicitado.
# 0 tentativas desliga o retry e faz cada falha depender do próximo resync.
#
# Com estes valores as esperas são 5s, 10s, 20s, 40s, 1m20s, 2m40s e 5m20s —
# uma janela de 10m35s antes de desistir. O teto de retry_max_delay não chega
# a ser alcançado: ele só passa a cortar se retry_max_attempts subir para 9 ou
# mais, quando a espera seguinte seria 10m40s.
retry_max_attempts: 8
retry_initial_delay: 5s
retry_max_delay: 10m

# Periodicidade com que o daemon publica seu estado no banco, para o
# `synkronyx -status` conseguir reportá-lo sem falar com o processo. É também
# o ritmo em que os pedidos de `-resolve` são aplicados, e a base do prazo a
# partir do qual o daemon é dado como parado (três intervalos sem heartbeat).
heartbeat_interval: 15s

# Sockets, FIFOs e device nodes não têm conteúdo que faça sentido copiar: um
# socket copiado é um arquivo inerte, um FIFO copiado é um FIFO vazio.
#
# skip  — ignora, registrando em nível debug (padrão)
# error — registra erro para cada um, para quem prefere descobrir que a
#         árvore tem conteúdo não sincronizável
special_files: skip

# Quantos eventos podem ser processados em paralelo. O particionamento é por
# subárvore de primeiro nível, o que preserva a ordem dentro de cada uma —
# criar um filho antes do pai nunca acontece. Renames entre subárvores passam
# por uma barreira que espera todos os workers ficarem ociosos.
#
# 1 mantém o processamento estritamente sequencial.
sync_workers: 4

# De quanto em quanto tempo um scan ou reconciliação longa reporta progresso.
# 0 desliga. Em árvores grandes é a diferença entre "está trabalhando" e
# "parece travado".
progress_interval: 30s
