# Synkronyx — configuração de exemplo
#
# Instalar em /etc/synkronyx/synkronyx.yaml

# As duas raízes da árvore lógica. Obrigatórias, absolutas, e não podem estar
# aninhadas uma na outra (aninhamento produz recursão infinita de eventos).
a: /dados/A
b: /dados/B

# Banco de estado. Precisa ser gravável pelo usuário do serviço.
state_path: /var/lib/synkronyx/state.db

# Janela de silêncio por path antes de propagar. Aumentar em cima de
# workloads que escrevem em rajada (builds, extração de arquivos); diminuir
# se a latência de propagação importar mais que o número de transferências.
debounce: 750ms

# Por quanto tempo uma escrita do próprio sincronizador continua sendo
# reconhecida como tal. Aumentar se houver arquivos muito grandes: a escrita
# precisa caber na janela. Não é o único mecanismo anti-loop (ver
# internal/guard), então errar para mais é barato.
self_write_ttl: 30s

# Padrões ignorados nos dois lados. Sem "/" casam contra qualquer componente
# do path; com "/" casam contra o path relativo inteiro.
exclude:
  - .synkronyx
  - "*.sync-conflict-*"
  - "*.swp"
  - "~$*"
  - .git/objects

# preserve    — renomeia a versão do destino e mantém as duas (padrão, fail safe)
# newer-wins  — o mtime mais recente vence
# manual      — não toca em nada; marca o par como em conflito
conflict_policy: preserve

# Como resolver divergências pré-existentes no primeiro scan.
# union   — o que existe só de um lado é copiado para o outro
# a-wins  — A é autoritativo
# b-wins  — B é autoritativo
first_sync_policy: union

rsync_path: rsync
rsync_args:
  - --archive
  - --partial
  - --inplace
  - --numeric-ids

# debug | info | warn | error
log_level: info

# Acima deste tamanho o digest passa a ser amostrado em vez de completo:
# tamanho + os primeiros e os últimos hash_sample_bytes. Detecta append,
# truncamento e reescrita de cabeçalho por custo fixo, mas não enxerga uma
# alteração no meio de um arquivo grande que preserve o tamanho.
# 0 = sempre completo (padrão, mais lento e sem pontos cegos).
hash_max_bytes: 0
hash_sample_bytes: 2097152  # 2 MiB de cada extremidade

# --hard-links só funciona dentro de uma mesma invocação do rsync, então a
# preservação vale para cópias de árvore (first sync, full resync, diretório
# novo) e não para arquivos propagados um a um por evento. Ligações criadas
# incrementalmente só voltam a existir no próximo full resync.
preserve_hardlinks: false

# O que fazer ao propagar a remoção de um diretório que, no destino, contém
# conteúdo que nunca foi sincronizado (criado lá e não propagado, ou alterado
# lá depois da última sincronização).
#
# preserve-unknown — move esse conteúdo para <dir>.sync-conflict-<lado>-<data>
#                    antes de remover (padrão, fail safe)
# force            — remove o diretório inteiro sem inspecionar
dir_delete_policy: preserve-unknown

# Reenvio de operações que falharam, com backoff exponencial. Esgotadas as
# tentativas, o path é marcado com erro e um full resync é solicitado.
# 0 tentativas desliga o retry e faz cada falha depender do próximo resync.
retry_max_attempts: 5
retry_initial_delay: 2s
retry_max_delay: 5m

# Periodicidade com que o daemon publica seu estado no banco, para o
# `synkronyx -status` conseguir reportá-lo sem falar com o processo.
heartbeat_interval: 30s
